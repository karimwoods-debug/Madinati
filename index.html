<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Madinati</title></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one phone-width column. Header, three tabs (Town, Wardrobe, Daily Deeds), a town map you tap to walk to a place, and a bottom sheet for each activity. */
:root{
  --bg:#EAF1EE; --surface:#FFFFFF; --ink:#12302C; --muted:#56706B; --line:#CBDAD5;
  --accent:#0E7C6B; --accent-ink:#FFFFFF; --gold:#C8962A; --good:#1B8A4B; --bad:#B4403A;
  --sky1:#B7DDE6; --sky2:#E4F2EE; --ground:#CBE2C2; --path:#E6D6AE; --wall:#F2EAD6;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --arabic:'Amiri','Traditional Arabic','Noto Naskh Arabic',serif;
  --water:#7EC3D8; --sun:#F7D774; --cloud:#FFFFFF; --leaf:#3E9A5B; --leaf-dk:#2D7444; --wood:#7A5430;
  --wall-dk:color-mix(in srgb,var(--wall) 78%,#6B5530); --accent-dk:color-mix(in srgb,var(--accent) 70%,#000);
  --gold-dk:color-mix(in srgb,var(--gold) 72%,#000); --ground-dk:color-mix(in srgb,var(--ground) 82%,#1D3B1D);
  --path-dk:color-mix(in srgb,var(--path) 80%,#5B4520);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1715; --surface:#13282A; --ink:#E3F0ED; --muted:#8FAAA5; --line:#264340;
  --accent:#3FBFA6; --accent-ink:#04211B; --gold:#E0B24A; --good:#4CC384; --bad:#E57B72;
  --sky1:#12303A; --sky2:#1B3D3E; --ground:#1D4232; --path:#5B5438; --wall:#D9D1BD; color-scheme:dark; --water:#24586A; --sun:#E9E5CF; --cloud:#2A4B50; --leaf:#2F7A4A; --leaf-dk:#225C37}
  :root:not([data-theme="light"]) .nite{display:inline}}
:root[data-theme="dark"]{
  --bg:#0A1715; --surface:#13282A; --ink:#E3F0ED; --muted:#8FAAA5; --line:#264340;
  --accent:#3FBFA6; --accent-ink:#04211B; --gold:#E0B24A; --good:#4CC384; --bad:#E57B72;
  --sky1:#12303A; --sky2:#1B3D3E; --ground:#1D4232; --path:#5B5438; --wall:#D9D1BD; color-scheme:dark; --water:#24586A; --sun:#E9E5CF; --cloud:#2A4B50; --leaf:#2F7A4A; --leaf-dk:#225C37}
:root[data-theme="dark"] .nite{display:inline}

[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.5 var(--body);background:var(--bg);color:var(--ink);
  padding-block:10px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:28px;line-height:1.1;letter-spacing:.01em}
.brand small{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px 5px 8px;font-weight:800;font-variant-numeric:tabular-nums}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);
  border:1px solid var(--line);padding:5px;border-radius:14px}
.tabs button{border:0;background:transparent;padding:10px 2px;font-size:15px;line-height:1.2;border-radius:10px;font-weight:800;color:var(--muted);min-height:44px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:18px}
.hello{font-family:var(--display);font-size:20px;font-weight:500;text-wrap:balance}
.hint{color:var(--muted);font-size:14px;margin:0}

.scene{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--sky2)}
.scene svg{display:block;width:100%;height:auto}
.bld{cursor:pointer}
.bld:focus-visible{outline:none}
.bld:focus-visible .hit{stroke:var(--accent);stroke-width:3;fill:rgba(14,124,107,.12)}
.bld:hover .hit{fill:rgba(14,124,107,.10)}
.hit{fill:transparent;stroke:transparent;rx:10}
.lbl{font:800 12px var(--body);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--sky2);stroke-width:3px;stroke-linejoin:round}
.me{transition:transform .85s cubic-bezier(.4,.1,.2,1);pointer-events:none}

.level{display:flex;flex-direction:column;gap:6px}
.level b{font-family:var(--display);font-weight:500}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}

label{font-weight:800;font-size:14px}
input[type=text]{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.prevwrap{display:flex;justify-content:center;background:linear-gradient(var(--sky1),var(--sky2));border-radius:12px;padding:12px}
.prev{width:150px;height:auto;max-width:100%}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button,.chipbtn{border:1px solid var(--line);background:var(--bg);padding:9px 16px;border-radius:999px;font-weight:800;min-height:44px}
.seg button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--c);position:relative;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.sw .tag{position:absolute;right:-6px;bottom:-6px;background:var(--gold);color:#1a1405;font:800 11px var(--body);border-radius:99px;padding:1px 6px;border:1px solid var(--surface)}
.note{font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin:0}

.deed{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:52px}
.deed .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.deed[aria-checked="true"]{border-color:var(--good)}
.deed[aria-checked="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.deed[aria-checked="true"] span.t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.deed .box svg{display:none}
.deed[aria-checked="true"] .box svg{display:block}
.group{display:flex;flex-direction:column;gap:8px}
.group>h3{font-size:15px;color:var(--muted);font-family:var(--body);font-weight:800;letter-spacing:.06em;text-transform:uppercase}

/* sheet */
#ov{position:fixed;inset:0;background:rgba(5,20,18,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--surface);color:var(--ink);
  border-radius:22px 22px 0 0;border:1px solid var(--line);
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-head h2{font-size:22px}
#sh-x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:22px;line-height:1}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:64px}
.act b{font-family:var(--display);font-weight:500;font-size:18px}
.act span{color:var(--muted);font-size:14px}
.prog{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;font-weight:800}
.q{font-family:var(--display);font-size:21px;font-weight:500;line-height:1.3;text-wrap:balance;margin:0}
.choices{display:flex;flex-direction:column;gap:10px}
.ch{width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:13px 14px;min-height:54px;font-weight:800}
.ch.ar{font-family:var(--arabic);font-size:40px;line-height:1.2;text-align:center;font-weight:700}
.choices.grid{display:grid;grid-template-columns:1fr 1fr}
.ch.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--bg))}
.ch.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg))}
.fb{margin:0;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:15px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:13px 18px;border-radius:12px;min-height:50px}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:34px;text-align:center;margin:0}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px;min-height:54px;font-weight:800}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--line);color:var(--muted);display:grid;place-items:center;font-size:14px}
.step.ok{border-color:var(--good)}
.step.ok .n{background:var(--good);color:#fff}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.foot{color:var(--muted);font-size:13px;text-align:center;margin:4px 0 0}

.aya{font-family:var(--arabic);font-size:34px;line-height:1.9;text-align:center;margin:0;padding:12px;background:var(--bg);border-radius:12px}
.ch.arl{font-family:var(--arabic);font-size:26px;line-height:1.7;direction:rtl;text-align:center;font-weight:700}
.deed.chk[aria-checked="true"] span.t{text-decoration:none;color:var(--ink)}
.ringwrap{position:relative;width:200px;height:200px;margin:0 auto}
.ringwrap svg{position:absolute;inset:0}
.tap{position:absolute;inset:24px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font:600 44px var(--display);font-variant-numeric:tabular-nums}
.tap:active{transform:scale(.97)}
.seg.wt button{padding:8px 13px}
.ra{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:44px;padding:8px 14px}
.btn.live{background:var(--bad);color:#fff;border-color:var(--bad)}
.tryrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border:2px solid var(--gold);border-radius:12px;padding:10px 12px}
.tryrow .btn{min-height:44px;padding:8px 16px}
.w.ok{color:var(--good)}
.w.bad{color:var(--bad);text-decoration:underline wavy}
/* detailed graphics and the Riverside Quarter */
.nite{display:none}
.drift{animation:drift 70s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(36px)}}
.ripple{animation:rip 2.6s ease-in-out infinite}
@keyframes rip{50%{opacity:.3}}
.zone-in{animation:fadein .45s ease-out}
@keyframes fadein{from{opacity:0}}
.zonebar button{flex:1}
.translit{font-style:italic;text-align:center;margin:0;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{min-height:78px;border-radius:12px;border:2px solid var(--line);background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px;display:grid;place-items:center;padding:4px}
.mc.up{background:var(--bg);color:var(--ink)}
.mc.ar{font-family:var(--arabic);font-size:38px;line-height:1}
.mc.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--bg));color:var(--ink);cursor:default}
.palm{display:block;width:100%;max-width:340px;margin:0 auto;height:auto;background:linear-gradient(var(--sky1),var(--sky2));border-radius:14px}
.palm .dt{cursor:pointer}
.palm .dt:focus-visible{outline:none}
.palm .dt:focus-visible .hitc{stroke:var(--accent);stroke-width:2.5}
.palm .dt.fall{transition:transform .5s ease-in,opacity .5s;transform:translateY(70px);opacity:0}
/* parent view */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px;line-height:1.25}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-weight:800;font-size:13px}
.tbl td.c,.tbl th.c{text-align:center}
.tbl .yes{color:var(--good);font-weight:800}
.tbl .no{color:var(--line)}
.day{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day b{font-weight:800}
.day small{color:var(--muted)}
.scroll{overflow-x:auto}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#bbb;--good:#1B6B3B;color-scheme:light}
  body{background:#fff;color:#000;padding:0}
  .tabs,.foot,#toast,.chips,.noprint{display:none!important}
  .card{break-inside:avoid;border-color:#bbb}
}
@media (prefers-reduced-motion:reduce){.me{transition:none}.sheet,.shake,.drift,.ripple,.zone-in{animation:none}.palm .dt.fall{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Madinati</h1><small>My city of learning</small></div>
    <div class="chips">
      <div class="chip" title="Barakah coins"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--gold)"/><path d="M11.6 5.1a5 5 0 1 0 0 9.8 4 4 0 1 1 0-9.8z" fill="#fff"/></svg><span id="coins">0</span><span class="sr" hidden>coins</span></div>
      <div class="chip" title="Stars of knowledge"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="4" width="12" height="12" fill="var(--accent)"/><rect x="4" y="4" width="12" height="12" fill="var(--accent)" transform="rotate(45 10 10)"/><circle cx="10" cy="10" r="2.6" fill="var(--surface)"/></svg><span id="stars">0</span></div>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="town" aria-selected="true">Town</button>
    <button role="tab" data-tab="wardrobe" aria-selected="false">Wardrobe</button>
    <button role="tab" data-tab="deeds" aria-selected="false">Daily deeds</button>
    <button role="tab" data-tab="parents" aria-selected="false">Parents</button>
  </nav>
  <main id="view"></main>
  <p class="foot">No music, no chat with strangers, no ads. Questions cover the basics, so check anything new with a parent or teacher. <span id="ver"></span></p>
</div>

<div id="ov" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
  <div class="sh-head"><h2 id="sh-t"></h2><button id="sh-x" aria-label="Close">&times;</button></div>
  <div id="sh-b"></div>
</div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* Change VERSION on every release, so a cached old copy is easy to spot. */
const VERSION='2026-11-20.4';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};

/* ---------- data ---------- */
const SKIN=['#F6D5B8','#E7B98F','#C98E64','#9C6540','#6B432B'];
const COLORS=[
  {id:'forest',n:'Forest',c:'#1F6B4F',cost:0},{id:'navy',n:'Navy',c:'#27447F',cost:0},
  {id:'plum',n:'Plum',c:'#6D3B70',cost:0},{id:'slate',n:'Slate',c:'#3E474D',cost:0},
  {id:'white',n:'White',c:'#F1F1EC',cost:0},{id:'teal',n:'Teal',c:'#0E8A8C',cost:20},
  {id:'rose',n:'Rose',c:'#B34E6F',cost:20},{id:'olive',n:'Olive',c:'#69782F',cost:25},
  {id:'maroon',n:'Maroon',c:'#7B2D37',cost:25},{id:'sky',n:'Sky blue',c:'#4A8BC6',cost:30},{id:'mint',n:'Mint',c:'#5FB99A',cost:20},{id:'lavender',n:'Lavender',c:'#8E79C2',cost:20},{id:'mustard',n:'Mustard',c:'#C49A2C',cost:25},{id:'burgundy',n:'Burgundy',c:'#6E1F3A',cost:25},{id:'brown',n:'Brown',c:'#6B4A32',cost:25},{id:'coral',n:'Coral',c:'#D9705B',cost:30}];
const SHOES=[{id:'black',n:'Black',c:'#2B2B2B',cost:0},{id:'brown',n:'Brown',c:'#6B4426',cost:0},{id:'white',n:'White',c:'#E8E8E2',cost:10},{id:'green',n:'Green',c:'#2F6B4B',cost:10},{id:'navy',n:'Navy',c:'#24366B',cost:10},{id:'maroon',n:'Maroon',c:'#6E2530',cost:10},{id:'tan',n:'Tan',c:'#B38B5D',cost:10}];
const SSTYLE=[{id:'shoes',n:'Shoes',cost:0},{id:'sneakers',n:'Sneakers',cost:10},{id:'boots',n:'Boots',cost:15}];
const HAND=[{id:'none',n:'Empty hands',cost:0},{id:'quran',n:"Qur'an",cost:15},{id:'tasbih',n:'Tasbih beads',cost:15},{id:'bottle',n:'Water bottle',cost:10},{id:'notebook',n:'Notebook',cost:10},{id:'lantern',n:'Lantern',cost:20},{id:'bouquet',n:'Flowers',cost:15},{id:'lunchbox',n:'Lunchbox',cost:10},{id:'dates',n:'Plate of dates',cost:15}];
const BACK=[{id:'none',n:'Nothing',cost:0},{id:'bag',n:'School bag',cost:20},{id:'mat',n:'Prayer mat',cost:20},{id:'satchel',n:'Satchel',cost:25},{id:'rucksack',n:'Rucksack',cost:25},{id:'tote',n:'Cloth tote',cost:15}];
const BADGE=[{id:'none',n:'None',cost:0},{id:'crescent',n:'Crescent',cost:10},{id:'star',n:'Star',cost:10},{id:'heart',n:'Heart',cost:10},{id:'mosque',n:'Mosque',cost:15},{id:'leaf',n:'Leaf',cost:10},{id:'diamond',n:'Diamond',cost:15}];
const TRIM=[{id:'none',n:'Plain',cost:0,c:null},{id:'white',n:'White',cost:10,c:'#F4F4EE'},{id:'gold',n:'Gold',cost:15,c:'#E0B24A'},{id:'silver',n:'Silver',cost:15,c:'#C9D3D6'},{id:'emerald',n:'Emerald',cost:15,c:'#1F8F6B'},{id:'rose',n:'Rose',cost:15,c:'#E3919F'},{id:'dots',n:'Gold embroidery',cost:20,c:'#E0B24A'}];
const HLEN=[{id:'regular',n:'Regular',cost:0},{id:'long',n:'Long',cost:10},{id:'layered',n:'Layered',cost:15}];
const HATS=[{id:'kufi',n:'Kufi',cost:0},{id:'imamah',n:'Imamah',cost:0},{id:'taqiyah',n:'Taqiyah',cost:10},{id:'ghutra',n:'Ghutra',cost:15}];
const PATTERN=[{id:'none',n:'Plain',cost:0},{id:'stripes',n:'Stripes',cost:10},{id:'stars',n:'Stars',cost:15},{id:'dots',n:'Dots',cost:10},{id:'checks',n:'Checks',cost:15}];
const GLOVES=[{id:'none',n:'No gloves',cost:0},{id:'black',n:'Black',cost:10},{id:'match',n:'Match jilbab',cost:10},{id:'white',n:'White',cost:10}];

  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.03);
}
function hiss(dur,freq,vol,delay=0){
  const a=actx();if(!a)return;const t=a.currentTime+delay,n=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);

  src.buffer=buf;f.type='bandpass';f.frequency.value=freq;f.Q.value=1.2;g.gain.value=vol;
  src.connect(f).connect(g).connect(a.destination);src.start(t);

function renderTown(fade){
  const lvl=Math.min(Math.floor(S.stars/10),LEVELS.length-1), into=S.stars%10, p=lvl>=LEVELS.length-1&&S.stars>=50?100:into*10;
  const Z=ZONES[zone], [x,y]=Z.spots[pos]||Z.spots.start, nm=S.name.trim(), D=GFX();
  $('#view').innerHTML=`
  <div class="hello">${nm?'Assalamu alaykum, '+esc(nm)+'!':'Assalamu alaykum!'} Tap a place to walk there.</div>
  <div class="seg zonebar" role="group" aria-label="District">${Object.entries(ZONES).map(([k,z])=>`<button data-z="${k}" aria-pressed="${k===zone}">${z.n}</button>`).join('')}</div>
  <div class="scene${fade?' zone-in':''}"><svg viewBox="0 0 360 456" role="group" aria-label="${Z.n} map">
    ${sceneDefs()}${sceneBg(D)}${zone==='old'?artOld(D):artRiver(D)}
    <g class="me" id="me" style="transform:translate(${x-22.5}px,${y-68}px) scale(.45)">${avatar(S)}</g>
  </svg></div>
  <div class="card level"><div style="display:flex;justify-content:space-between;gap:8px"><b>Level ${lvl+1}: ${LEVELS[lvl]}</b><span class="hint">${S.stars} stars</span></div>
    <div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
    <p class="hint">Stars show how much you have learned.</p></div>
  <div class="card"><h3>How to earn coins</h3>
    <div class="group"><p class="hint"><b>Quizzes:</b> 3 coins for each correct answer, once per quiz each day.</p>
    <p class="hint"><b>Order games</b> (prayer, wudu, five pillars): 10 coins each, once a day.</p>
    <p class="hint"><b>Riverside games:</b> letter match, date harvest and the dua of the day pay once a day too.</p>
    <p class="hint"><b>Daily deeds:</b> 3 coins for every good deed you tick.</p></div>
    <p class="hint">Spend coins in the Wardrobe on colours, trim, shoes and accessories. Give some at the Sadaqah Market too.</p></div>
  <div class="card"><h3>Graphics</h3>
    <div class="seg" role="group" aria-label="Graphics"><button data-gfx="detailed" aria-pressed="${D}">Detailed</button><button data-gfx="simple" aria-pressed="${!D}">Simple</button></div>
    <p class="hint">Simple uses plainer pictures and no moving clouds. It can be faster on older phones.</p></div>
  <div class="card"><h3>Sound</h3>
    <div class="seg" role="group" aria-label="Sound">${[['off','Off'],['fx','Effects'],['all','Effects and narrator']].map(([k,n])=>`<button data-snd="${k}" aria-pressed="${S.sound===k}">${n}</button>`).join('')}</div>
    <p class="hint">Off by default. Effects are short taps and chimes, never music. The narrator reads questions and instructions in English. It never reads Arabic, so learn the Qur’an and duas from a real teacher.</p></div>`;

const PLACES={masjid:'Masjid',madrasa:'Madrasa',library:'Library',garden:'Garden of Adab',market:'Sadaqah Market',home:'My Home',wudu:'Wudu Fountain',park:'Play Park',pillars:'Pillars Hall',orchard:'Date Orchard'};
let walking=false;
function goPlace(b){
  const Z=ZONES[zone]; if(!Z.spots[b]||walking)return;
  pos=b; const me=$('#me'); if(!me)return; const [x,y]=Z.spots[b];
  me.style.transform=`translate(${x-22.5}px,${y-68}px) scale(.45)`;
  const delay=matchMedia('(prefers-reduced-motion:reduce)').matches?0:750;
  walking=true;if(delay)sfx('steps');
  setTimeout(()=>{
    walking=false; if(tab!=='town')return;
    if(b==='gate'){zone=Z.other;S.zone=zone;save();pos='gate';renderTown(true);sfx('whoosh');toast('Welcome to the '+ZONES[zone].n+'!');return}
    openPlace(b);
  },delay);
}

/* ---------- sheet ---------- */
let sheetGen=0;
function stopAudio(){if(listen.stop)listen.stop();if(window.speechSynthesis)speechSynthesis.cancel()}
function openSheet(title){stopAudio();sheetGen++;$('#sh-t').textContent=title;$('#ov').hidden=false;$('#sh-x').focus()}
function closeSheet(){stopAudio();sheetGen++;$('#ov').hidden=true;if(tab==='town')renderTown()}
function body(html){const b=$('#sh-b');b.innerHTML=html;return b}
function menu(title,items){
  openSheet(title);
  const b=body(items.map((it,i)=>`<button class="act" data-i="${i}" style="margin-bottom:10px"><b>${it[0]}</b><span>${it[1]}</span></button>`).join(''));
  b.querySelectorAll('.act').forEach(btn=>btn.onclick=()=>{sfx('tap');items[+btn.dataset.i][2]()});
  say(title,'Choose one: '+items.map(it=>it[0]).join(', '));
}
function openPlace(b){

/* ---------- speech checking (works only where the browser allows the microphone) ---------- */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
const norm=t=>t.replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g,'').replace(/[ٱآأإ]/g,'ا').replace(/[ىیئ]/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/ک/g,'ك').replace(/[^ء-ي\s]/g,' ').split(/\s+/).filter(Boolean);
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>{const r=Array(n+1).fill(0);r[0]=i;return r});for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function alignWords(expected,heard){
  const E=norm(expected),H=norm(heard),n=E.length,m=H.length;
  const sc=(a,b)=>lev(a,b)/Math.max(a.length,b.length);
  const D=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=1;i<=n;i++)D[i][0]=i;for(let j=1;j<=m;j++)D[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+sc(E[i-1],H[j-1]));
  const ok=Array(n).fill(false);let i=n,j=m;
  while(i>0&&j>0){
    const s=sc(E[i-1],H[j-1]);
    if(Math.abs(D[i][j]-(D[i-1][j-1]+s))<1e-9){ok[i-1]=s<=0.34;i--;j--}
    else if(Math.abs(D[i][j]-(D[i-1][j]+1))<1e-9)i--;
    else j--;
  }
  return {ok,score:n?ok.filter(Boolean).length/n:0};
}
function grade(expected,alts){let best={ok:[],score:-1};for(const a of alts){const r=alignWords(expected,a);if(r.score>best.score)best=r}return best}
/* Android Chrome often ends a recognition session at once, before the child speaks.
   So keep restarting until we hear something, then keep going until a short silence.
   Recognition asks for the microphone itself: opening it first with getUserMedia
   can make Android end the session straight away. */
let lastLog='';
function listen(done,opt={}){
  if(!SRC){done({err:'unsupported'});return}
  if(window.speechSynthesis)speechSynthesis.cancel();
  const gen=sheetGen,t0=Date.now(),LIMIT=opt.limit||25000,log=[];
  let fin=false,rec=null,segs=[],interim='',gotNew=false,sessions=0,idle=0,cap=0;
  const text=()=>[...segs.map(a=>a[0]),interim].join(' ').trim();
  const alts=()=>{const t=text();if(!t)return null;const out=[t];
    for(let k=1;k<3;k++)if(segs.some(a=>a[k]))out.push([...segs.map(a=>a[k]||a[0]),interim].join(' ').trim());return out};
  const finish=err=>{
    if(fin)return;fin=true;clearTimeout(cap);clearTimeout(idle);listen.stop=null;
    try{rec&&rec.abort()}catch(e){}
    lastLog=log.slice(-8).join(',')+' x'+sessions;
    if(gen!==sheetGen)return;
    const a=alts();done(a?{alts:a}:{err:err||'no-speech'});
  };
  const HARD=['not-allowed','service-not-allowed','audio-capture','network','language-not-supported','bad-grammar'];
  const start=()=>{
    if(fin)return;sessions++;gotNew=false;
    try{rec=new SRC()}catch(e){finish('unsupported');return}
    rec.lang='ar-SA';rec.interimResults=true;rec.maxAlternatives=3;rec.continuous=false;
    rec.onresult=e=>{
      clearTimeout(idle);interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];
        if(r.isFinal){segs.push([...r].map(x=>x.transcript));gotNew=true}else interim+=r[0].transcript+' '}
      interim=interim.trim();if(interim)gotNew=true;
      if(opt.onHear)opt.onHear(text());
      if(opt.enough&&opt.enough(text()))finish();
    };
    rec.onerror=e=>{log.push(e.error);if(HARD.includes(e.error))finish(e.error)};
    rec.onend=()=>{
      log.push('end');if(fin)return;
      if(interim){segs.push([interim]);interim=''}
      const more=Date.now()-t0<LIMIT&&sessions<20;
      if(!text()){more?setTimeout(start,120):finish('no-speech');return}
      if(gotNew&&more){setTimeout(start,120);clearTimeout(idle);idle=setTimeout(()=>finish(),2500);return}
      finish();
    };
    try{rec.start();log.push('start')}catch(e){finish('unsupported')}
  };
  cap=setTimeout(()=>finish(),LIMIT);
  listen.stop=()=>finish();
  start();
}
/* one microphone button: tap to start, tap again to finish early */
function micButton(label,expected,onResult){
  const m=$('#mic'),res=$('#res');
  m.onclick=()=>{
    if(listen.stop){listen.stop();return}
    m.textContent='Listening… tap when you finish';m.classList.add('live');m.setAttribute('aria-pressed','true');
    sfx('tap');
    res.innerHTML='<p class="fb">Listening. Say it now.</p>';
    listen(r=>{
      m.textContent=label;m.classList.remove('live');m.setAttribute('aria-pressed','false');
      if(r.err){sfx('wrong');
        /* "not allowed" can come from the website permission or from the phone's speech service.
           Asking Chrome for the microphone tells the two apart. */
        if((r.err==='not-allowed'||r.err==='service-not-allowed')&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
          res.innerHTML='<p class="fb">Checking the microphone…</p>';
          navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{st.getTracks().forEach(t=>t.stop());return 'ok'},e=>'denied-'+(e&&e.name||'error'))
            .then(probe=>{if(document.body.contains(res))res.innerHTML=`<p class="fb">${errMsg(r.err,probe)}</p>`});
          return}
        res.innerHTML=`<p class="fb">${errMsg(r.err)}</p>`;return}
      const g=grade(expected,r.alts);sfx(g.score>=PASS?'right':'wrong');onResult(g);
    },{enough:t=>grade(expected,[t]).score>=1,onHear:t=>{const n=norm(t).length;res.innerHTML=`<p class="fb">Listening… I have heard ${n} word${n===1?'':'s'} so far.</p>`}});
  };

function errMsg(c,probe){

  if(probe==='ok'&&(c==='not-allowed'||c==='service-not-allowed'))return `Chrome can use the microphone, but your phone’s speech recognition service refused. Your listener can confirm instead. On Android, try these:
    <ol style="margin:6px 0 0;padding-left:20px"><li>Settings, Apps, <b>Google</b>, Permissions, Microphone: Allow. Do the same for “Speech Services by Google” if your phone has it.</li>
    <li>Open Madinati in the <b>Chrome app</b> itself, not from a link inside WhatsApp, Gmail or another app.</li>
    <li>Settings, System, Languages and input: turn on <b>Google voice typing</b> and add <b>Arabic</b>.</li></ol>`+code;
  if(c==='not-allowed'||c==='audio-capture')return 'The microphone is blocked. Tap the lock icon next to the web address, allow Microphone, then reload the page. Your listener can confirm instead.'+code;
  if(c==='service-not-allowed'||c==='unsupported')return 'Speech recognition is not available in this browser. Your listener can confirm instead.'+code;

/* hifz quiz */
function hifzItems(ids,n){
  const pool=SURAHS.filter(s=>ids.includes(s.id)), all=SURAHS.flatMap(s=>s.a);
  const words=[...new Set(all.join(' ').split(' '))].filter(w=>w.length>1);
  const items=[],seen=new Set(); let guard=0;
  while(items.length<n&&guard++<300){
    const s=pool[Math.floor(Math.random()*pool.length)];
    if(Math.random()<.5&&s.a.length>=2){
      const i=Math.floor(Math.random()*(s.a.length-1)), key='n'+s.id+i; if(seen.has(key))continue; seen.add(key);
      const right=s.a[i+1], wrong=shuffle(all.filter(a=>a!==right&&a!==s.a[i])).slice(0,2);
      items.push({q:'Which ayah comes next?',pre:s.a[i],o:[right,...wrong],a:right,e:`That is ${s.n}, ayah ${i+2}. Keep repeating it with your teacher.`,long:true});
    }else{
      const i=Math.floor(Math.random()*s.a.length), w=s.a[i].split(' '); if(w.length<3)continue;
      const k=Math.floor(Math.random()*w.length), key='m'+s.id+i+'-'+k; if(seen.has(key))continue; seen.add(key);
      const right=w[k], wrong=shuffle(words.filter(x=>x!==right)).slice(0,3);
      items.push({q:'Which word is missing?',pre:w.map((x,j)=>j===k?'_____':x).join(' '),o:[right,...wrong],a:right,e:`That is ${s.n}, ayah ${i+1}.`,big:true});
    }
  }
  return items;
}
function hifzQuiz(ids,label){

}

}

    const h=S.hist[w.k]||{a:{},d:[]}, acts=Object.keys(h.a), deeds=(h.d||[]).length;
    return `<div class="day"><b>${esc(fmt(w.d))}${w.k===today()?' (today)':''}</b>
      <small>${acts.length||deeds?`${acts.length} ${acts.length===1?'activity':'activities'}, ${deeds} good ${deeds===1?'deed':'deeds'} ticked`:'Nothing recorded'}</small>
      ${acts.length?`<small>${acts.map(a=>esc(actName(a))+(h.a[a]>1?' ×'+h.a[a]:'')).join(', ')}</small>`:''}</div>`}).join('');
  const PR=DEEDS[0][1];
  const prayers=`<div class="scroll"><table class="tbl"><thead><tr><th scope="col">Prayer</th>${week.map(w=>`<th scope="col" class="c">${esc(w.d.toLocaleDateString(undefined,{weekday:'narrow'}))}</th>`).join('')}<th scope="col" class="c">Days</th></tr></thead><tbody>
    ${PR.map(([id,t])=>{const on=week.map(w=>((S.hist[w.k]||{}).d||[]).includes(id));
      return `<tr><th scope="row">${esc(t.replace('Prayed ',''))}</th>${on.map(o=>`<td class="c ${o?'yes':'no'}">${o?'✓':'·'}</td>`).join('')}<td class="c">${on.filter(Boolean).length}/7</td></tr>`}).join('')}</tbody></table></div>`;
  const quran=`<div class="scroll"><table class="tbl"><thead><tr><th scope="col">Surah</th><th scope="col" class="c">Recited</th><th scope="col" class="c">From memory</th><th scope="col" class="c">Hifz quiz best</th></tr></thead><tbody>
    ${SURAHS.map(x=>{const b=S.best['hifz:'+x.id];return `<tr><th scope="row">${esc(x.n)}</th><td class="c">${(S.rec||{})[x.id]||0}</td><td class="c">${S.mem[x.id]||0}</td><td class="c">${b?b.s+' / '+b.n:'–'}</td></tr>`}).join('')}</tbody></table></div>`;
  const qs=Object.keys(S.best).filter(k=>!/^hifz:[^,]+$/.test(k)).sort((a,b)=>quizName(a).localeCompare(quizName(b)));
  const quizzes=qs.length?`<div class="scroll"><table class="tbl"><thead><tr><th scope="col">Quiz</th><th scope="col" class="c">Best</th><th scope="col" class="c">Last</th><th scope="col" class="c">Played</th></tr></thead><tbody>
    ${qs.map(k=>{const b=S.best[k];return `<tr><th scope="row">${esc(quizName(k))}</th><td class="c">${b.s} / ${b.n}</td><td class="c">${b.last??'–'} / ${b.n}</td><td class="c">${b.t}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="hint">No quizzes finished yet.</p>';
  const duas=`<div class="scroll"><table class="tbl"><thead><tr><th scope="col">Dua</th><th scope="col" class="c">Practised</th></tr></thead><tbody>
    ${DUAS.map(d=>`<tr><th scope="row">${esc(d.n)}</th><td class="c">${(S.rec||{})[d.id]||0}</td></tr>`).join('')}</tbody></table></div>`;
  $('#view').innerHTML=`
  <section class="card"><h3>${S.name.trim()?esc(S.name.trim())+'’s progress':'Progress'}</h3>
    <p class="hint">This page is for parents and teachers. Everything here stays on this device. Daily history started on ${esc(fmt(since))}.</p>
    <div class="stats">${stat(lvl+1,'Level: '+LEVELS[lvl])}${stat(S.stars,'Stars of knowledge')}${stat(S.coins,'Coins to spend')}
      ${stat(active+' / 7','Days active this week')}${stat(streak(),'Day streak')}${stat(S.given,'Coins given ('+Math.floor(S.given/50)+' wells)')}</div>
    <button class="btn alt noprint" id="print">Print a progress sheet</button></section>
  <section class="card"><h3>The last 7 days</h3><div>${days}</div></section>
  <section class="card"><h3>Prayers ticked in Daily deeds</h3>${prayers}<p class="hint">Children tick these themselves, so treat them as a conversation starter.</p></section>
  <section class="card"><h3>Qur’an</h3>${quran}<p class="hint">The microphone check compares words only. It cannot judge tajweed.</p></section>
  <section class="card"><h3>Quiz scores</h3>${quizzes}</section>
  <section class="card"><h3>Duas</h3>${duas}</section>`;
  $('#print').onclick=()=>window.print();
}

/* ---------- wiring ---------- */
function render(){
  if(tab!=='wardrobe')trial={};
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  ({town:renderTown,wardrobe:renderWardrobe,deeds:renderDeeds,parents:renderParents})[tab]();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('.tabs button');if(t){tab=t.dataset.tab;sfx('tap');stopAudio();render();return}
  const b=e.target.closest('.bld');if(b&&tab==='town'){goPlace(b.dataset.b);return}
  const z=e.target.closest('#view [data-z]');if(z){if(z.dataset.z!==zone)goPlace('gate');return}
  const sn=e.target.closest('#view [data-snd]');if(sn){S.sound=sn.dataset.snd;save();renderTown();sfx('right');say('The narrator is on. I will read the questions to you.');return}
  const gx=e.target.closest('#view [data-gfx]');if(gx){S.gfx=gx.dataset.gfx;save();renderTown();return}
  const bu=e.target.closest('#view [data-buy]');if(bu){buy(bu.dataset.buy);return}
  const rm=e.target.closest('#view [data-rm]');if(rm){delete trial[rm.dataset.rm];renderWardrobe();return}
  const w=e.target.closest('#view [data-w]');if(w){wtab=w.dataset.w;renderWardrobe();return}
  const k=e.target.closest('#view [data-k]');if(k){pick(k.dataset.k,k.dataset.v);return}
  const d=e.target.closest('[data-d]');if(d){toggleDeed(d.dataset.d);return}
  if(e.target.id==='sh-x'||e.target.id==='ov')closeSheet();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#ov').hidden)closeSheet();
  const b=e.target.closest&&e.target.closest('.bld');
  if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();goPlace(b.dataset.b)}
});
document.addEventListener('input',e=>{if(e.target.id==='nm'){S.name=e.target.value;save()}});
renderTop();render();
$('#ver').textContent='Version '+VERSION+'.';
</script>
</body></html>
